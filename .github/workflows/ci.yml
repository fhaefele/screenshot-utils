name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect extension changes
        id: filter
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync, readFileSync} from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const base = event.pull_request?.base.sha ?? event.before;
          const head = event.pull_request?.head.sha ?? process.env.GITHUB_SHA;
          let extension = true;
          if (process.env.GITHUB_REF_TYPE !== 'tag' && base && !/^0+$/.test(base)) {
              try {
                  const range = `${base}${event.pull_request ? '...' : '..'}${head}`;
                  const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', range])
                      .toString().split('\0').filter(Boolean);
                  const documentation = file => file.endsWith('.md') || [
                      'LICENSE', '.gitignore', 'assets/screenshot-utils.png', 'assets/screenshot-utils-dark.png',
                  ].includes(file);
                  extension = files.some(file => !documentation(file));
              } catch (error) {
                  console.warn(`Cannot determine changed files; running full CI: ${error.message}`);
              }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `extension=${extension}\n`);
          console.log(extension ? 'Run build and GNOME tests' : 'Documentation only; skip build and GNOME tests');
          JS

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.extension != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin zip unzip
      - run: npm ci
      - run: npm run lint
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const metadata = JSON.parse(readFileSync('metadata.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${metadata['version-name']}`)
              throw new Error('Release tag must match metadata version-name');
          JS
      - name: Check syntax and schemas
        run: |
          for file in *.js scripts/*.js tests/*.js; do node --check "$file"; done
          glib-compile-schemas --strict --dry-run schemas
      - run: npm test
      - run: npm run test:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-utils
          path: dist/*/*.shell-extension.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  integration:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.extension != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            test: legacy
            mode: ubuntu
          - os: ubuntu-24.04
            test: gnome
            mode: user
          - os: ubuntu-26.04
            test: gnome
            mode: user
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gnome-shell-extension-prefs dconf-gsettings-backend dconf-service gjs zip unzip xvfb xauth dmz-cursor-theme yaru-theme-gnome-shell librsvg2-common libgl1-mesa-dri gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0
      - run: npm ci
      - run: npm run test:${{ matrix.test }}
        env:
          SCREENSHOT_UTILS_TEST_SHELL_MODE: ${{ matrix.mode }}

  release:
    if: github.ref_type == 'tag'
    needs: [build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshot-utils
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/legacy/*.shell-extension.zip dist/screenshot-utils-gnome42-44.shell-extension.zip
          cp dist/modern/*.shell-extension.zip dist/screenshot-utils-modern.shell-extension.zip
          gh release create "$GITHUB_REF_NAME" dist/*.shell-extension.zip \
            --verify-tag \
            --title "Screenshot Utils ${GITHUB_REF_NAME#v}" --notes-from-tag
